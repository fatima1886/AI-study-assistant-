

 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="./output.css" rel="stylesheet">

    <title>AI Study Assistant - Notes</title>

    <style>
        html {
            font-family: "Poppins", sans-serif;
        }
    </style>

</head>

<body class="bg-slate-50 text-slate-900">

    <section class="mx-auto max-w-7xl px-6 py-16">

        <div class="flex flex-col gap-8 lg:flex-row">

            <!-- ================= Sidebar ================= -->

            <aside class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm lg:w-80">

                <h2 class="text-lg font-semibold">
                    My Notes
                </h2>

                <p class="mt-1 text-sm text-slate-500">
                    Capture your study notes.
                </p>

                <!-- Search -->

                <div class="relative mt-6">

                    <span
                        class="absolute left-3 top-1/2 -translate-y-1/2 cursor-pointer text-slate-400 searchIcon">

                        🔍

                    </span>

                    <input id="search" type="text" placeholder="Search Notes..."
                        class="w-full rounded-xl border border-slate-200 py-3 pl-10 pr-4 outline-none focus:ring-2 focus:ring-indigo-600">

                </div>

                <!-- Notes List -->

                <ul class="listItem mt-6 space-y-2">

                    <!-- JavaScript will insert notes here -->

                </ul>

            </aside>

            <!-- ================= Editor ================= -->

            <main class="flex-1">

                <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">

                    <div class="flex items-center justify-between">

                        <div>

                            <h2 class="text-xl font-semibold">

                                Create Note

                            </h2>

                            <p class="selectedNote text-sm text-slate-500 mt-1">

                                No note selected

                            </p>

                        </div>

                    </div>

                    <!-- Title -->

                    <input id="note-title" type="text" placeholder="Note Title"
                        class="mt-8 w-full rounded-xl border border-slate-200 p-4 text-lg font-semibold outline-none focus:ring-2 focus:ring-indigo-600">

                    <!-- Body -->

                    <textarea id="note-body" placeholder="Write your notes..."
                        class="mt-6 h-72 w-full resize-none rounded-xl border border-slate-200 p-4 outline-none focus:ring-2 focus:ring-indigo-600"></textarea>

                    <!-- Validation -->

                    <p class="alertPara mt-4 hidden font-semibold text-red-500">

                        Title and body are required.

                    </p>

                    <!-- Buttons -->

                    <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-end">
                        <button id="copyNote" class="Savebtn rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white hover:bg-indigo-700">Copy</button>

                        <button id="deleteBtn"
                            class="rounded-xl border border-red-300 px-5 py-3 font-semibold text-red-600 hover:bg-red-50">

                            Delete Note

                        </button>

                        <button class="Savebtn rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white hover:bg-indigo-700">

                            Save Note

                        </button>

                    </div>

                </div>

            </main>

        </div>

    </section>

    <script type="module" src="notes.js"></script>

</body>

</html>
