<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="./output.css" rel="stylesheet">
  <title>AI Study Assistant — Notes</title>
  <style>html{font-family: 'Poppins', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;}</style>
</head>
<body class="bg-slate-50 text-slate-900">
    <section id="notes" class="mx-auto w-full max-w-7xl px-6 py-16 lg:px-8">
      <div class="mx-auto flex max-w-7xl flex-col gap-8 lg:flex-row">
        <!-- Sidebar -->
        <aside class="w-full rounded-2xl bg-white border border-slate-200 p-6 shadow-sm lg:w-80">
          <div class="mb-4">
            <h2 class="text-lg font-semibold text-slate-900">My Notes</h2>
            <p class="mt-1 text-sm text-slate-600">Capture your ideas and study notes.</p>
          </div>
    
          <label for="search" class="sr-only">Search notes</label>
          <div class="relative mb-6">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18.5a7.5 7.5 0 006.15-1.85z"></path>
              </svg>
            </span>
            <input id="search" type="search" placeholder="Search notes..." class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-11 pr-4 text-sm text-slate-600 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600" />
          </div>
    
          <nav aria-label="Notes list" class="flow-root">
            <ul class="listItem -mx-2 divide-y  divide-slate-100">
              <!-- Note Item 1 (active) -->
              <!-- <li >
                <a href="#" class="flex items-start gap-3 rounded-lg bg-indigo-50 p-3 text-left transition hover:bg-slate-50">
                  <div class="flex-shrink-0">
                    <div class="flex h-9 w-9 items-center justify-center rounded-2xl bg-white text-indigo-600 border border-slate-200">📄</div>
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center justify-between gap-4">
                      <p class="title truncate text-sm font-semibold text-slate-900"></p>
                      <p class="ml-2 text-xs text-slate-500">2h ago</p>
                    </div>
                    <p class="body mt-1 truncate text-xs text-slate-600"></p>
                  </div>
                </a>
              </li> -->
    
             
            </ul>
          </nav>
        </aside>
    
        <!-- Editor -->
        <main class="w-full">
          <div class="rounded-2xl bg-white border border-slate-200 p-8 shadow-lg">
            <div class="mb-6 flex items-start justify-between gap-4">
              <div>
                <h3 class="text-lg font-semibold text-slate-900">Create Note</h3>
                <p class="mt-1 text-sm text-slate-600">Write and organize your study notes.</p>
              </div>
              <div class="hidden items-center gap-3 text-sm text-slate-500 sm:flex">
                <span class="text-xs text-slate-400">Autosave off</span>
              </div>
            </div>
    
            <div class="space-y-6">
              <div>
                <label for="note-title" class="sr-only">Note title</label>
                <input  id="note-title" type="text" placeholder="Enter note title" class="w-full rounded-xl border border-slate-200 bg-white p-4 text-lg font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600" />

              </div>
    
              <div>
                <label for="note-body" class="sr-only">Note body</label>
                <textarea id="note-body" placeholder="Write your notes here..." class="h-64 w-full resize-none rounded-xl border border-slate-200 bg-white p-4 text-sm leading-6 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600"></textarea>
                
              </div>
            </div>
    
            <div class="mt-8 flex flex-col items-stretch gap-3 sm:flex-row sm:items-center sm:justify-end">
              <p class="alertPara hidden text-red-600 font-semibold text-sm ">Both of these are required!</p>
              <button type="button" class="order-2 inline-flex items-center justify-center rounded-xl bg-white border border-red-200 px-5 py-3 text-sm font-semibold text-red-600 transition hover:bg-red-50 sm:order-1">Delete Note</button>
              <button type="button" class="Savebtn order-1 inline-flex items-center justify-center rounded-xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow transition hover:bg-indigo-700 sm:order-2">Save Note</button>
            </div>
          </div>
        </main>
      </div>
    </section>
    

    <script type="module" src="notes.js"></script>
</body>
</html>
