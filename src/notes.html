

 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="./output.css" rel="stylesheet">
    <script src="./theme.js"defer></script>

    <title>AI Study Assistant - Notes</title>

    <style>
        html {
            font-family: "Poppins", sans-serif;
        }
    </style>

</head>

<body class="bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-[#131b2e] dark:text-slate-50">

    <section class="mx-auto max-w-7xl px-6 py-16">

        <div class="mb-6 flex justify-end">
            <button id="dark-toggle-btn" type="button" aria-label="Toggle dark mode" class="group relative inline-flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white/80 text-slate-700 shadow-sm transition duration-300 hover:-translate-y-0.5 hover:border-indigo-400 hover:bg-indigo-50 hover:text-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:border-slate-700 dark:bg-slate-800/80 dark:text-slate-100 dark:hover:border-indigo-400 dark:hover:bg-slate-700 dark:focus:ring-offset-[#131b2e]">
                <svg class="sun-icon h-5 w-5 transition duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="M4.93 4.93l1.41 1.41"></path>
                    <path d="M17.66 17.66l1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="M4.93 19.07l1.41-1.41"></path>
                    <path d="M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="moon-icon hidden h-5 w-5 transition duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
                </svg>
            </button>
        </div>

        <div class="flex flex-col gap-8 lg:flex-row">

            <!-- ================= Sidebar ================= -->

            <aside class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-colors duration-300 dark:border-amber-600 dark:bg-[#1e293b] lg:w-80">

                <h2 class="text-lg font-semibold dark:text-slate-50">
                    My Notes
                </h2>

                <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
                    Capture your study notes.
                </p>

                <!-- Search -->

                <div class="relative mt-6">

                    <span
                        class="absolute left-3 top-1/2 -translate-y-1/2 cursor-pointer text-slate-400 searchIcon">

                        🔍

                    </span>

                    <input id="search" type="text" placeholder="Search Notes..."
                        class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-10 pr-4 text-slate-900 outline-none transition focus:ring-2 focus:ring-indigo-600 dark:border-slate-700 dark:bg-slate-900/70 dark:text-slate-100 dark:placeholder:text-slate-500">

                </div>

                <!-- Notes List -->

                <ul class="listItem mt-6 space-y-2">

                    <!-- JavaScript will insert notes here -->

                </ul>

            </aside>

            <!-- ================= Editor ================= -->

            <main class="flex-1">

                <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg transition-colors duration-300 dark:border-[#059669] dark:bg-[#1e293b]">

                    <div class="flex items-center justify-between">

                        <div>

                            <h2 class="text-xl font-semibold dark:text-slate-50">

                                Create Note

                            </h2>

                            <p class="selectedNote mt-1 text-sm text-slate-500 dark:text-slate-400">

                                No note selected

                            </p>

                        </div>

                    </div>

                    <!-- Title -->

                    <input id="note-title" type="text" placeholder="Note Title"
                        class="mt-8 w-full rounded-xl border border-slate-200 bg-white p-4 text-lg font-semibold text-slate-900 outline-none transition focus:ring-2 focus:ring-indigo-600 dark:border-slate-700 dark:bg-slate-900/70 dark:text-slate-100 dark:placeholder:text-slate-500">

                    <!-- Body -->

                    <textarea id="note-body" placeholder="Write your notes..."
                        class="mt-6 h-72 w-full resize-none rounded-xl border border-slate-200 bg-white p-4 text-slate-900 outline-none transition focus:ring-2 focus:ring-indigo-600 dark:border-slate-700 dark:bg-slate-900/70 dark:text-slate-100 dark:placeholder:text-slate-500"></textarea>

                    <!-- Validation -->

                    <p class="alertPara mt-4 hidden font-semibold text-red-500 dark:text-red-400">

                        Title and body are required.

                    </p>

                    <!-- Buttons -->

                    <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-end">

                        <button id="deleteBtn"
                            class="rounded-xl border border-red-300 px-5 py-3 font-semibold text-red-600 transition hover:bg-red-50 dark:border-red-500/40 dark:text-red-400 dark:hover:bg-red-500/10">

                            Delete Note

                        </button>

                         <button class="Copybtn rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white transition hover:bg-indigo-700">

                           Copy

                        </button>

                        <button class="Savebtn rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white transition hover:bg-indigo-700">

                            Save Note

                        </button>

                    </div>

                </div>

            </main>

        </div>

    </section>

    <script type="module" src="notes.js"></script>

</body>

</html>
